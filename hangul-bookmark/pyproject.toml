[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hangul-bookmark"
version = "0.2.2"
description = "Local bookmark-based Hancom document writer for Codex"
requires-python = ">=3.10"
dependencies = ["pyhwpx==1.7.2; sys_platform == 'win32'", "mcp==2.3.0", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hangul-bookmark = "hangul_bookmark.server:main"
